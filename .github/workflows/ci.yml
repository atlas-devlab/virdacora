name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build, tests and local demonstrations
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # Offline stability replay checks the implementation's earlier Git commit.

      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Set up pnpm 11.7.0
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: '11.7.0'
          run_install: false
          cache: false

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace
        run: pnpm build

      - name: Check workspace
        run: pnpm check

      - name: Run tests
        run: pnpm test

      - name: Run synthetic sensor demonstration
        run: pnpm demo

      - name: Run local blockchain demonstration
        run: pnpm e2e

      - name: Replay and verify the pinned real USGS oxygen case
        run: |
          pnpm case:replay
          pnpm case:verify
          pnpm case:e2e

      - name: Replay and reproduce the observation-only multivariate experiment
        # The new numerical experiment stays separate from the certified operational assessment.
        run: |
          pnpm forecast:replay
          pnpm forecast:verify
          pnpm forecast:verify "$PWD/docs/evidence/willamette-forecast"

      - name: Replay the sealed Awash learning game without network access
        run: |
          python3 scripts/awash_irrigation.py verify
          pnpm --filter @terravoce/environmental-case irrigation:verify

      - name: Reproduce autonomous discovery and adversarial local-chain evidence offline
        run: |
          pnpm source:verify
          pnpm source:e2e
          python3 scripts/explore_evidence_quorum.py
          python3 scripts/audit_autonomous_source.py

      - name: Run synthetic LAD and complete Python regression tests
        run: |
          python3 -m venv .venv-owasco-lad-ci
          .venv-owasco-lad-ci/bin/python -m pip install --disable-pip-version-check -r scripts/requirements-owasco-lad.txt
          .venv-owasco-lad-ci/bin/python -m unittest discover -s scripts -p 'test_*.py'

      - name: Validate Oracle bridge digest interoperability
        run: |
          python3 -m venv services/autonomy/.venv
          services/autonomy/.venv/bin/python -m pip install -r services/autonomy/requirements.txt
          services/autonomy/.venv/bin/python -m pytest services/autonomy/tests -q
          python3 scripts/audit_willamette.py --external --summary --verify-artifacts docs/evidence/willamette-forecast
          python3 scripts/audit_training_readiness.py --summary --verify docs/evidence/willamette-forecast/training-readiness.json
          python3 scripts/experiment_multiseason.py verify-fit
          python3 scripts/experiment_multiseason.py verify
          python3 scripts/forecast_diagnostics.py verify
          node --test scripts/test-capture-stability.mjs
          if [ -f docs/evidence/willamette-stability/evaluation.json.gz ]; then
            python3 scripts/evaluate_stability.py verify --report docs/evidence/willamette-stability/evaluation.json.gz
            python3 scripts/audit_stability_evidence.py . > "$RUNNER_TEMP/stability-independent-audit.json"
            python3 scripts/diagnose_stability_errors.py verify
            python3 scripts/threshold_development.py preflight --verify-report docs/evidence/willamette-threshold-development/preflight.json
            python3 scripts/evaluate_threshold_development.py verify --report docs/evidence/willamette-threshold-development/evaluation.json
            python3 scripts/lake_transfer.py verify --report docs/evidence/owasco-lake-transfer/evaluation.json
            python3 scripts/audit_owasco_evidence.py
            python3 scripts/owasco_gain_bins.py --input docs/evidence/owasco-lake-transfer/evaluation.json --protocol docs/datasets/owasco-gain-diagnostic/protocol.json --verify-report docs/evidence/owasco-gain-diagnostic/diagnostic.json
            python3 scripts/owasco_temporal_validation.py verify --report docs/evidence/owasco-temporal-validation/evaluation.json
            python3 scripts/owasco_direction_diagnostic.py --protocol docs/datasets/owasco-direction-diagnostic/protocol.json --verify-report docs/evidence/owasco-direction-diagnostic/diagnostic.json
            python3 scripts/audit_owasco_direction.py
            python3 scripts/owasco_attenuation_diagnostic.py --protocol docs/datasets/owasco-attenuation-diagnostic/protocol.json --verify-report docs/evidence/owasco-attenuation-diagnostic/diagnostic.json
            python3 scripts/audit_owasco_attenuation.py
            python3 scripts/owasco_local_median_preflight.py --protocol docs/datasets/owasco-local-median/protocol.json --verify-report docs/evidence/owasco-local-median/preflight.json
            if [ -f docs/evidence/owasco-local-median/frozen-model.json ]; then
              python3 scripts/owasco_local_median.py verify-model
              python3 scripts/audit_owasco_local_median.py
            fi
            if [ -f docs/evidence/owasco-local-median/development.json.gz ]; then
              python3 scripts/owasco_local_median.py verify-report
              python3 scripts/audit_owasco_local_median.py --report
            fi
          else
            python3 scripts/stability_protocol.py
          fi

      - name: Test four replicas with node outages
        if: github.event_name == 'workflow_dispatch'
        run: |
          services/autonomy/.venv/bin/python services/autonomy/prepare.py
          docker build -f services/autonomy/Dockerfile -t terravoce-autonomy:local .
          docker build -f services/autonomy/Oracle.Dockerfile -t terravoce-oracle:local .
          AUTONOMY_PYTHON="$PWD/services/autonomy/.venv/bin/python" pnpm --filter @terravoce/contracts autonomy:e2e
