services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: terravoce
      POSTGRES_PASSWORD: terravoce
      POSTGRES_DB: terravoce
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U terravoce -d terravoce"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - terravoce-postgres:/var/lib/postgresql
      - ./services/oracle/db/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
      - ./services/oracle/db/002_timestamp_order.sql:/docker-entrypoint-initdb.d/002_timestamp_order.sql:ro

  oracle:
    build:
      context: .
      dockerfile: services/oracle/Dockerfile
    environment:
      PORT: 8787
      HOST: 0.0.0.0
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:-development-admin-token}
      ORACLE_API_TOKEN: ${ORACLE_API_TOKEN:-development-oracle-token}
      DATABASE_URL: postgres://terravoce:terravoce@postgres:5432/terravoce
      POLICY_PATH: /app/policies/po-water-v1.terra
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      - "8877:8787"

volumes:
  terravoce-postgres:
